<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#890F14" />
      <stop offset="100%" stop-color="#5C0A0D" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39C12" />
      <stop offset="100%" stop-color="#D35400" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C84A" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
  </defs>

  <!-- Circular Emblem -->
  <circle cx="50" cy="50" r="44" fill="url(#saffronGrad)" />
  <circle cx="50" cy="50" r="39" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Food / Spice Pot Emblem -->
  <path d="M33,63 C33,69 67,69 67,63 L63,45 L37,45 Z" fill="url(#saffronGrad)" />
  <!-- Pot Rim -->
  <rect x="34" y="42" width="32" height="5" rx="2.5" fill="url(#goldGrad)" />
  <!-- Steaming Aroma Swirls -->
  <path d="M42,37 C40,30 46,26 44,19" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M50,37 C48,28 54,24 52,16" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M58,37 C56,30 62,26 60,19" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Brand Typography -->
  <text x="110" y="48" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#890F14" letter-spacing="-0.5">DESI <tspan fill="#E67E22">FOODS</tspan></text>
  
  <!-- Subtitle Tag -->
  <rect x="110" y="58" width="165" height="22" rx="11" fill="rgba(230,126,34,0.15)" stroke="rgba(230,126,34,0.3)" />
  <text x="122" y="73" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#D35400" letter-spacing="1.5">HOUNSLOW'S FINEST</text>
</svg>
